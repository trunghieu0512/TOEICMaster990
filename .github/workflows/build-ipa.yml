name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild clean build \
            -project TOEICMaster990.xcodeproj \
            -scheme TOEICMaster990 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app into .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/TOEICMaster990.app Payload/
          zip -r TOEICMaster990-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TOEICMaster990-IPA-File
          path: TOEICMaster990-Unsigned.ipa
